name: Docker Build and Push

on:
  push:
    branches: ["xxell-main", "feature/integrate-with-backend"]
  pull_request:

env:
  REGISTRY: ghcr.io
  DOCKER_METADATA_PR_HEAD_SHA: true

jobs:
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract server metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/meetingbot-server
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - name: Build and push server Docker image
        uses: docker/build-push-action@v4
        with:
          context: src/server
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AUTH_SECRET=fake-secret
            AUTH_GITHUB_ID=fake-github-id
            AUTH_GITHUB_SECRET=fake-github-secret
            DATABASE_URL=postgresql://fake:fake@localhost:5432/fake
            GITHUB_TOKEN=fake-token
            AWS_ACCESS_KEY_ID=fake-key
            AWS_SECRET_ACCESS_KEY=fake-secret
            AWS_BUCKET_NAME=fake-bucket
            AWS_REGION=us-east-1
            ECS_TASK_DEFINITION_MEET=fake-task
            ECS_TASK_DEFINITION_TEAMS=fake-task
            ECS_TASK_DEFINITION_ZOOM=fake-task
            ECS_CLUSTER_NAME=fake-cluster
            ECS_SUBNETS=fake-subnet
            ECS_SECURITY_GROUPS=fake-sg
            CLOUD_PROVIDER=AWS
            DEPLOYMENT_PLATFORM=KUBERNETES
            EXTERNAL_SYSTEM_BASE_URL=https://fake-system.com
            EXTERNAL_SYSTEM_API_KEY=fake-api-key
            USE_EXTERNAL_SYSTEM_UPLOAD=false
            DOCKER_REGISTRY_OWNER=${{ github.repository_owner }}

  bots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        bot: [teams, meet, zoom]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:

          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/meetingbot-bots-${{ matrix.bot }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: src/bots
          file: src/bots/${{ matrix.bot }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

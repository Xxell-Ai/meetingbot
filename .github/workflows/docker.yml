name: Docker Build and Push

on:
  push:
    branches:
      - "xxell-main"
      - "feature/**"
  pull_request:

env:
  REGISTRY: registry.digitalocean.com
  DOCKER_METADATA_PR_HEAD_SHA: true

jobs:
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to DigitalOcean Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Determine environment and tag
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/xxell-main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "tag_prefix=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/feature/* ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "tag_prefix=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "tag_prefix=dev" >> $GITHUB_OUTPUT
          fi
          echo "commit_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Extract server metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/meetingbot/meetingbot-server
          tags: |
            type=raw,value=${{ steps.env.outputs.tag_prefix }}-${{ steps.env.outputs.commit_sha }}
            type=raw,value=${{ steps.env.outputs.tag_prefix }}-latest

      - name: Build and push server Docker image
        uses: docker/build-push-action@v4
        with:
          context: src/server
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Checkout Helm repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v3
        with:
          repository: Xxell-Ai/helm
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: helm-repo

      - name: Update Helm chart values
        if: github.event_name != 'pull_request'
        run: |
          cd helm-repo

          # Update image tag in the appropriate environment values file
          VALUES_FILE="meetingbot/values/${{ steps.env.outputs.environment }}.yaml"

          if [[ -f "$VALUES_FILE" ]]; then
            # Update image tag using sed
            sed -i "s|tag:.*|tag: ${{ steps.env.outputs.tag_prefix }}-${{ steps.env.outputs.commit_sha }}|g" "$VALUES_FILE"
            echo "Updated $VALUES_FILE with new image tag: ${{ steps.env.outputs.tag_prefix }}-${{ steps.env.outputs.commit_sha }}"
          else
            echo "Values file $VALUES_FILE not found"
            exit 1
          fi

      - name: Commit Helm changes
        if: github.event_name != 'pull_request'
        run: |
          cd helm-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add meetingbot/values/${{ steps.env.outputs.environment }}.yaml
          git commit -m "Update ${{ steps.env.outputs.environment }} image tag to ${{ steps.env.outputs.tag_prefix }}-${{ steps.env.outputs.commit_sha }}" || exit 0
          git push

  bots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        bot: [meet]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to DigitalOcean Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Determine environment and tag
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/xxell-main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "tag_prefix=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/feature/* ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "tag_prefix=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "tag_prefix=dev" >> $GITHUB_OUTPUT
          fi
          echo "commit_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/meetingbot/meetingbot-bots-${{ matrix.bot }}
          tags: |
            type=raw,value=${{ steps.env.outputs.tag_prefix }}-${{ steps.env.outputs.commit_sha }}
            type=raw,value=${{ steps.env.outputs.tag_prefix }}-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: src/bots
          file: src/bots/${{ matrix.bot }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

apiVersion: v1
kind: Namespace
metadata:
  name: meetingbot
  labels:
    app: meetingbot
    environment: production
---
# Service Account for MeetingBot server to manage bot jobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meetingbot-server
  namespace: meetingbot
  labels:
    app: meetingbot
    component: server

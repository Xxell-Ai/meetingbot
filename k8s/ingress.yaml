apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meetingbot-ingress
  namespace: meetingbot
  labels:
    app: meetingbot
  annotations:
    # Nginx Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    nginx.ingress.kubernetes.io/rate-limit-requests-per-minute: "60"
    
    # CORS settings
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Certificate management (adjust based on your cert-manager setup)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - meetingbot.yourdomain.com # Replace with your actual domain
    secretName: meetingbot-tls
  rules:
  - host: meetingbot.yourdomain.com # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: meetingbot-server
            port:
              number: 3000

---
# Alternative Ingress for local development (without TLS)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meetingbot-ingress-local
  namespace: meetingbot
  labels:
    app: meetingbot
    environment: local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: meetingbot.local # Add to /etc/hosts: 127.0.0.1 meetingbot.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: meetingbot-server
            port:
              number: 3000

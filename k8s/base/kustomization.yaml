apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: meetingbot-base

# Base resources that are common across all environments
resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - secrets.yaml
  - server-deployment.yaml
  - server-service.yaml

# Common labels applied to all resources
labels:
  - pairs:
      app: meetingbot
      version: v1.0.0

# Common annotations
commonAnnotations:
  managed-by: kustomize

# Note: Image tags are handled in overlays for environment-specific versions
# Note: ConfigMap and Secret overrides are handled in overlays

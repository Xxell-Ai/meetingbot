apiVersion: apps/v1
kind: Deployment
metadata:
  name: meetingbot-server
  namespace: meetingbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meetingbot-server
  template:
    metadata:
      labels:
        app: meetingbot-server
    spec:
      serviceAccountName: meetingbot-service-account
      containers:
      - name: server
        image: meetingbot-server:latest
        ports:
        - containerPort: 3000
        env:
        # Basic Configuration
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: meetingbot-config
              key: NODE_ENV
        - name: KUBE_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: meetingbot-config
              key: KUBE_NAMESPACE
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: meetingbot-config
              key: BACKEND_URL
        - name: DEPLOYMENT_PLATFORM
          valueFrom:
            configMapKeyRef:
              name: meetingbot-config
              key: DEPLOYMENT_PLATFORM
        
        # DigitalOcean Spaces Configuration
        - name: DO_SPACES_REGION
          valueFrom:
            configMapKeyRef:
              name: meetingbot-config
              key: DO_SPACES_REGION
        - name: DO_SPACES_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: meetingbot-config
              key: DO_SPACES_ENDPOINT
        - name: USE_EXTERNAL_SYSTEM_UPLOAD
          valueFrom:
            configMapKeyRef:
              name: meetingbot-config
              key: USE_EXTERNAL_SYSTEM_UPLOAD
        
        # Secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: meetingbot-secrets
              key: DATABASE_URL
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: meetingbot-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: meetingbot-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: DO_SPACES_BUCKET
          valueFrom:
            secretKeyRef:
              name: meetingbot-secrets
              key: DO_SPACES_BUCKET
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: meetingbot-secrets
              key: AUTH_SECRET
        - name: NEXTAUTH_URL
          valueFrom:
            secretKeyRef:
              name: meetingbot-secrets
              key: NEXTAUTH_URL
        - name: AUTH_GITHUB_ID
          valueFrom:
            secretKeyRef:
              name: meetingbot-secrets
              key: AUTH_GITHUB_ID
        - name: AUTH_GITHUB_SECRET
          valueFrom:
            secretKeyRef:
              name: meetingbot-secrets
              key: AUTH_GITHUB_SECRET
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: meetingbot-secrets
              key: GITHUB_TOKEN
        
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5


apiVersion: apps/v1
kind: Deployment
metadata:
  name: meetingbot-server
  namespace: meetingbot-local
  labels:
    app: meetingbot
    component: server
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meetingbot-server
      environment: local
  template:
    metadata:
      labels:
        app: meetingbot-server
        environment: local
    spec:
      serviceAccountName: meetingbot-service-account
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
      initContainers:
        # Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U postgres; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        # Run database migrations
        - name: db-migrate
          image: ghcr.io/xxell-ai/meetingbot-server:sha-8cca387
          command:
            - /bin/sh
            - -c
            - |
              echo "Running database migrations..."
              cd /app
              echo "Checking if migrations are needed..."
              
              # Try using the built-in migration script first
              if [ -f "package.json" ] && grep -q "db:migrate" package.json; then
                echo "Using npm script for migrations..."
                npm run db:migrate
              else
                echo "Using direct Drizzle migration..."
                # Use the updated Drizzle migration approach
                node -e "
                const { migrate } = require('drizzle-orm/postgres-js/migrator');
                const { drizzle } = require('drizzle-orm/postgres-js');
                const postgres = require('postgres');
                
                async function runMigrations() {
                  try {
                    console.log('Connecting to database...');
                    const sql = postgres(process.env.DATABASE_URL, { max: 1 });
                    const db = drizzle(sql);
                    
                    console.log('Running migrations from ./drizzle folder...');
                    await migrate(db, { migrationsFolder: './drizzle' });
                    
                    console.log('Migrations completed successfully!');
                    await sql.end();
                  } catch (error) {
                    console.error('Migration failed:', error);
                    process.exit(1);
                  }
                }
                
                runMigrations();
                " || {
                  echo "Direct migration failed, trying alternative approach..."
                  # Alternative: try using drizzle-kit if available
                  npx drizzle-kit migrate || {
                    echo "Migration tools not available, skipping migrations..."
                    echo "Please ensure your database schema is up to date"
                  }
                }
              fi
              echo "Database migration completed!"
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: meetingbot-config
                  key: DATABASE_URL
            - name: NODE_ENV
              value: "development"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      containers:
        - name: server
          image: ghcr.io/xxell-ai/meetingbot-server:sha-8cca387
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            # From ConfigMap
            - name: DEPLOYMENT_PLATFORM
              valueFrom:
                configMapKeyRef:
                  name: meetingbot-config
                  key: DEPLOYMENT_PLATFORM
            - name: KUBE_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: meetingbot-config
                  key: KUBE_NAMESPACE
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: meetingbot-config
                  key: NODE_ENV
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: meetingbot-config
                  key: BACKEND_URL
            - name: DOMAIN_NAME
              valueFrom:
                configMapKeyRef:
                  name: meetingbot-config
                  key: DOMAIN_NAME
            - name: CURRENT_COMMIT_SHA
              valueFrom:
                configMapKeyRef:
                  name: meetingbot-config
                  key: CURRENT_COMMIT_SHA
            - name: DO_SPACES_REGION
              valueFrom:
                configMapKeyRef:
                  name: meetingbot-config
                  key: DO_SPACES_REGION
            - name: DO_SPACES_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: meetingbot-config
                  key: DO_SPACES_ENDPOINT
            - name: USE_EXTERNAL_SYSTEM_UPLOAD
              valueFrom:
                configMapKeyRef:
                  name: meetingbot-config
                  key: USE_EXTERNAL_SYSTEM_UPLOAD
            
            # Database from ConfigMap (easier to manage for local dev)
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: meetingbot-config
                  key: DATABASE_URL
            
            # From Secrets
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: meetingbot-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: meetingbot-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: DO_SPACES_BUCKET
              valueFrom:
                secretKeyRef:
                  name: meetingbot-secrets
                  key: DO_SPACES_BUCKET
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: meetingbot-secrets
                  key: AUTH_SECRET
            - name: AUTH_TRUST_HOST
              valueFrom:
                secretKeyRef:
                  name: meetingbot-secrets
                  key: AUTH_TRUST_HOST
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: meetingbot-secrets
                  key: NEXTAUTH_URL
            - name: AUTH_GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: meetingbot-secrets
                  key: AUTH_GITHUB_ID
            - name: AUTH_GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: meetingbot-secrets
                  key: AUTH_GITHUB_SECRET
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

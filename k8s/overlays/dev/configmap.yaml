apiVersion: v1
kind: ConfigMap
metadata:
  name: meetingbot-config
  namespace: meetingbot-dev
  labels:
    app: meetingbot
    environment: dev
data:
  # Environment-specific configuration
  NODE_ENV: "development"
  KUBE_NAMESPACE: "meetingbot-dev"
  DEPLOYMENT_PLATFORM: "kubernetes"

  # Backend URL for dev environment
  BACKEND_URL: "https://dev.meetingbot.yourdomain.com"

  # DigitalOcean Spaces Configuration (common settings)
  DO_SPACES_REGION: "sgp1"
  DO_SPACES_ENDPOINT: "https://sgp1.digitaloceanspaces.com"
  USE_EXTERNAL_SYSTEM_UPLOAD: "true"

  # Dev-specific settings
  DEBUG: "true"
  LOG_LEVEL: "debug"
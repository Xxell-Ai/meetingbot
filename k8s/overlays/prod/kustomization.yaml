apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: meetingbot-prod

# Namespace override for production environment
namespace: meetingbot-prod

# Environment-specific labels
labels:
  - pairs:
      environment: prod

# Include base resources
resources:
  - ../../base
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml

# Image overrides for production environment
# This will be updated automatically by the CI/CD workflow
images:
  - name: meetingbot-server
    newName: registry.digitalocean.com/meetingbot/meetingbot-server
    newTag: prod-latest

# Production-specific patches can be added here
# For example: resource limits, replicas, etc.
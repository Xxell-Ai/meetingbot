apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: meetingbot-local

# Namespace override for local environment
namespace: meetingbot-local

# Environment-specific labels
labels:
  - pairs:
      environment: local

# Include base resources
resources:
  - ../../base
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml

  # Local-only resources
  - postgres.yaml

# Image overrides for local development
images:
  - name: meetingbot-server
    newName: meetingbot-server
    newTag: local-latest